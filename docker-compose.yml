services:
  db:
    image: postgres:16-alpine
    container_name: spay-bienestar-db
    environment:
      POSTGRES_USER: spay
      POSTGRES_PASSWORD: spay123
      POSTGRES_DB: spay_bienestar_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
